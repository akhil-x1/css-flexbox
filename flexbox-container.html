<!doctype html>
<html>
  <head>
    <title>Flex box container</title>
    <style>
      .container {
      }

      .flexcontainer-row {
        background-color: dodgerblue;
        display: flex;
        flex-direction: row;
      }
      .flexcontainer-row div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 20px;
        font-size: 24px;
      }

      .flexcontainer-column {
        display: flex;
        flex-direction: column;
        background-color: dodgerblue;
      }
      .flexcontainer-column div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 20px;
        font-size: 24px;
      }

      .flexcontainer-rowreverse {
        display: flex;
        flex-direction: row-reverse;
        background-color: dodgerblue;
      }

      .flexcontainer-rowreverse div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 20px;
        font-size: 24px;
      }

      .flexcontainer-columnreverse {
        display: flex;
        flex-direction: column;
        background-color: dodgerblue;
      }

      .flexcontainer-columnreverse div {
        background-color: #f1f1f1;
        margin: 10px;
        padding: 20px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Flex direction row</h1>
      <div class="flexcontainer-row">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
      </div>
      <h1>Flex direction column</h1>
      <div class="flexcontainer-column">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
      </div>
      <h1>Flex direction row reverse</h1>
      <div class="flexcontainer-rowreverse">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
      </div>
      <h1>Flex direction column reverse</h1>
      <div class="flexcontainer-columnreverse">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
      </div>
    </div>
  </body>
</html>
